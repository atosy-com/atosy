<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Tài liệu tham khảo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;

      background: #EEF3F8;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Google Sans",
        "Noto Sans",
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .viewer {
      min-height: 100vh;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      padding: 16px;
    }

    .loading {
      width:
        min(
          360px,
          calc(100vw - 40px)
        );

      margin-top: 42px;

      color: #163F73;

      text-align: center;
    }

    .loading-title {
      font-size: 16px;
      font-weight: 800;
    }

    .loading-detail {
      margin-top: 7px;

      color: #67809A;

      font-size: 12px;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 8px;

      margin-top: 14px;

      overflow: hidden;

      border-radius: 999px;

      background: #D5E0EB;
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background: #2D75C7;

      transition: width .15s ease;
    }

    .error {
      display: none;

      width:
        min(
          440px,
          calc(100vw - 40px)
        );

      margin-top: 42px;

      padding: 16px;

      border-radius: 16px;

      background: #FFFFFF;

      color: #8B1E1E;

      box-shadow:
        0 8px 26px rgba(16,55,92,0.10);

      text-align: left;

      font-size: 13px;
      line-height: 1.5;
    }

    .canvas-wrap {
      display: none;

      width: 100%;

      text-align: center;
    }

    canvas {
      display: block;

      max-width: 100%;
      height: auto;

      margin: 0 auto;

      background: #FFFFFF;

      border-radius: 8px;

      box-shadow:
        0 8px 26px rgba(16,55,92,0.16);
    }

    @media (max-width: 700px) {

      .viewer {
        padding: 10px;
      }

      canvas {
        border-radius: 6px;
      }

    }
  </style>
</head>

<body>

  <div class="viewer">

    <div
      id="loading"
      class="loading">

      <div class="loading-title">
        Đang mở trang tài liệu...
      </div>

      <div
        id="loading-detail"
        class="loading-detail">

        Đang đọc dữ liệu cần thiết.
      </div>

      <div class="progress-track">

        <div
          id="progress-bar"
          class="progress-bar">
        </div>

      </div>

    </div>


    <div
      id="error"
      class="error">
    </div>


    <div
      id="canvas-wrap"
      class="canvas-wrap">

      <canvas id="pdf-canvas"></canvas>

    </div>

  </div>


  <script type="module">

    import * as pdfjsLib
      from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


    const params =
      new URLSearchParams(
        window.location.search
      );


    const file =
      String(
        params.get("file") ||
        ""
      ).trim();


    let pageNum =
      Number(
        params.get("page")
      ) || 1;


    const canvas =
      document.getElementById(
        "pdf-canvas"
      );


    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );


    function hienLoi(
      message
    ) {

      document.getElementById(
        "loading"
      ).style.display =
        "none";


      document.getElementById(
        "canvas-wrap"
      ).style.display =
        "none";


      const error =
        document.getElementById(
          "error"
        );


      error.style.display =
        "block";


      error.innerText =
        message;

    }


    async function khoiDong() {

      if (!file) {

        hienLoi(
          "Không tìm thấy đường dẫn PDF."
        );

        return;

      }


      try {

        /*
         * Mục tiêu:
         * - chỉ render đúng 1 trang được yêu cầu;
         * - ưu tiên HTTP Range Request;
         * - tắt stream toàn file;
         * - tắt tự tải các phần chưa cần.
         *
         * PDF.js vẫn có thể cần đọc thêm một số vùng của file
         * (xref / object liên quan) tùy cấu trúc PDF.
         */
        const loadingTask =
          pdfjsLib.getDocument({

            url:
              file,

            rangeChunkSize:
              64 * 1024,

            disableRange:
              false,

            disableStream:
              true,

            disableAutoFetch:
              true

          });


        loadingTask.onProgress =
          function(progressData) {

            const loaded =
              Number(
                progressData &&
                progressData.loaded
              ) || 0;


            const total =
              Number(
                progressData &&
                progressData.total
              ) || 0;


            if (
              total > 0
            ) {

              const percent =
                Math.max(
                  0,
                  Math.min(
                    100,
                    Math.round(
                      loaded /
                      total *
                      100
                    )
                  )
                );


              document.getElementById(
                "progress-bar"
              ).style.width =
                percent + "%";


              document.getElementById(
                "loading-detail"
              ).innerText =
                "Đang đọc dữ liệu cần thiết • " +
                percent +
                "%";

            } else {

              document.getElementById(
                "loading-detail"
              ).innerText =
                "Đang đọc dữ liệu cần thiết...";

            }

          };


        const pdfDoc =
          await loadingTask.promise;


        pageNum =
          Math.max(
            1,
            Math.min(
              pageNum,
              pdfDoc.numPages
            )
          );


        const page =
          await pdfDoc.getPage(
            pageNum
          );


        const baseViewport =
          page.getViewport({
            scale: 1
          });


        const availableWidth =
          Math.max(
            260,
            window.innerWidth -
            (
              window.innerWidth <= 700
                ? 20
                : 36
            )
          );


        const fitScale =
          availableWidth /
          baseViewport.width;


        const viewport =
          page.getViewport({
            scale:
              fitScale
          });


        const outputScale =
          Math.min(
            window.devicePixelRatio || 1,
            2
          );


        canvas.width =
          Math.floor(
            viewport.width *
            outputScale
          );


        canvas.height =
          Math.floor(
            viewport.height *
            outputScale
          );


        canvas.style.width =
          Math.floor(
            viewport.width
          ) + "px";


        canvas.style.height =
          Math.floor(
            viewport.height
          ) + "px";


        const transform =
          outputScale !== 1

            ? [
                outputScale,
                0,
                0,
                outputScale,
                0,
                0
              ]

            : null;


        await page.render({

          canvasContext:
            ctx,

          viewport:
            viewport,

          transform:
            transform,

          intent:
            "display"

        }).promise;


        document.getElementById(
          "loading"
        ).style.display =
          "none";


        document.getElementById(
          "error"
        ).style.display =
          "none";


        document.getElementById(
          "canvas-wrap"
        ).style.display =
          "block";


      } catch (err) {

        console.error(
          err
        );


        hienLoi(
          err &&
          err.message

            ? "Không thể mở trang tài liệu: " +
              err.message

            : "Không thể mở trang tài liệu."
        );

      }

    }


    khoiDong();

  </script>

</body>
</html>
