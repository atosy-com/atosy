<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent">

  <meta
    name="theme-color"
    content="#0B3D91">

  <title>Atosy Learning</title>


  <!-- =====================================================
       ICON
       ===================================================== -->

  <link
    rel="apple-touch-icon"
    href="icon-250.png">

  <link
    rel="icon"
    type="image/png"
    href="icon-500.png">

  <link
    rel="manifest"
    href="manifest.json">


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background:
        #041B33;

    }


    /* =====================================================
       APPS SCRIPT IFRAME
       ===================================================== */

    #atosy-app {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;

      margin: 0;
      padding: 0;

      display: block;

      background:
        #041B33;

    }


    /* =====================================================
       LOADING
       ===================================================== */

    .loading {

      position: fixed;

      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 14px;

      background:
        linear-gradient(
          135deg,
          #041B33 0%,
          #0B3D91 50%,
          #1E6FD9 100%
        );

      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      z-index: 9999;

      transition:
        opacity .2s ease,
        visibility .2s ease;

    }


    .loading.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    .loading-logo {

      width: 74px;
      height: 74px;

      object-fit: contain;

      border-radius: 18px;

      background: white;

      box-shadow:
        0 8px 24px rgba(0,0,0,0.18);

    }


    .loading-title {

      font-size: 20px;

      font-weight: 800;

      line-height: 1;

    }


    .loading-dot {

      width: 28px;
      height: 4px;

      border-radius: 999px;

      background:
        rgba(255,255,255,0.28);

      overflow: hidden;

      position: relative;

    }


    .loading-dot::after {

      content: "";

      position: absolute;

      top: 0;
      bottom: 0;

      width: 45%;

      border-radius: inherit;

      background: white;

      animation:
        loadingMove 1s ease-in-out infinite;

    }


    @keyframes loadingMove {

      0% {
        left: -45%;
      }

      100% {
        left: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LOADING SCREEN
       ===================================================== -->

  <div
    class="loading"
    id="loading">

    <img
      class="loading-logo"
      src="icon-250.png"
      alt="Atosy Learning">


    <div class="loading-title">

      Atosy Learning

    </div>


    <div class="loading-dot"></div>

  </div>



  <!-- =====================================================
       APPS SCRIPT
       ===================================================== -->

  <iframe
    id="atosy-app"
    src="https://script.google.com/macros/s/AKfycbyM3HkKEIkfCJ6ePL9voTKEtiVIxA6wivDNWXSq2ZBDoB-MSwy3wBYSFJclHC-R9YDa/exec"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">

  </iframe>



  <script>

    // =========================================================
    // IFRAME
    // =========================================================

    const iframe =
      document.getElementById(
        "atosy-app"
      );


    const loading =
      document.getElementById(
        "loading"
      );



    // =========================================================
    // ẨN LOADING SAU KHI APPS SCRIPT LOAD XONG
    // =========================================================

    iframe.addEventListener(
      "load",
      function() {

        setTimeout(
          function() {

            loading.classList.add(
              "hidden"
            );

          },
          120
        );

      }
    );



    // =========================================================
    // NHẬN LỆNH ĐIỀU HƯỚNG TỪ APPS SCRIPT
    //
    // Apps Script sẽ gửi:
    //
    // window.parent.postMessage({
    //   type: "ATOSY_NAVIGATE",
    //   url: "https://script.google.com/..."
    // }, "*");
    //
    // GitHub wrapper sẽ chỉ đổi iframe.src
    // KHÔNG đổi trang ngoài.
    // =========================================================

    window.addEventListener(
      "message",
      function(event) {

        const data =
          event.data || {};


        // -----------------------------------------------------
        // Chỉ nhận đúng lệnh Atosy
        // -----------------------------------------------------

        if (
          data.type !==
          "ATOSY_NAVIGATE"
        ) {

          return;

        }


        // -----------------------------------------------------
        // Phải có URL
        // -----------------------------------------------------

        if (
          !data.url
        ) {

          return;

        }


        const url =
          String(
            data.url
          );


        // -----------------------------------------------------
        // Chỉ cho phép URL Apps Script
        // -----------------------------------------------------

        const hopLe =

          url.startsWith(
            "https://script.google.com/"
          )

          ||

          url.startsWith(
            "https://script.googleusercontent.com/"
          );


        if (
          !hopLe
        ) {

          console.warn(
            "Atosy Learning chặn URL không hợp lệ:",
            url
          );

          return;

        }


        // -----------------------------------------------------
        // Hiện loading trong lúc chuyển trang
        // -----------------------------------------------------

        loading.classList.remove(
          "hidden"
        );


        // -----------------------------------------------------
        // CHỈ ĐỔI IFRAME
        // Không thay đổi top-level GitHub Pages
        // -----------------------------------------------------

        iframe.src =
          url;

      }
    );



    // =========================================================
    // NHẬN LỆNH RELOAD NẾU SAU NÀY CẦN
    // =========================================================

    window.addEventListener(
      "message",
      function(event) {

        const data =
          event.data || {};


        if (
          data.type !==
          "ATOSY_RELOAD"
        ) {

          return;

        }


        loading.classList.remove(
          "hidden"
        );


        iframe.src =
          iframe.src;

      }
    );

  </script>


</body>

</html>
